services:
  signal-center:
    build: .
    ports:
      - "8501:8501"
    volumes:
      - ./data/cache:/app/data/cache
      - ./results:/app/results
    restart: unless-stopped

  paper-monitor:
    build: .
    command: python paper_monitor.py
    volumes:
      - ./data/cache:/app/data/cache
      - ./results:/app/results
    restart: unless-stopped
