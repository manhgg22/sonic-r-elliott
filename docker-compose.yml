x-sonic-environment: &sonic-environment
  SONIC_DB_PATH: ${SONIC_DB_PATH:-results/paper_trading.db}
  SONIC_RISK_PCT_PER_TRADE: ${SONIC_RISK_PCT_PER_TRADE:-0.5}
  SONIC_MAX_PORTFOLIO_RISK_PCT: ${SONIC_MAX_PORTFOLIO_RISK_PCT:-2.0}
  SONIC_MAX_TRADES_PER_WEEK: ${SONIC_MAX_TRADES_PER_WEEK:-5}
  SONIC_PENDING_EXPIRY_BARS: ${SONIC_PENDING_EXPIRY_BARS:-4}
  SONIC_SCAN_LOCK_STALE_SECONDS: ${SONIC_SCAN_LOCK_STALE_SECONDS:-600}
  SONIC_REALTIME_MAX_INSTRUMENTS: ${SONIC_REALTIME_MAX_INSTRUMENTS:-50}
  SONIC_REALTIME_STALE_SECONDS: ${SONIC_REALTIME_STALE_SECONDS:-10}
  SONIC_REALTIME_BROADCAST_INTERVAL: ${SONIC_REALTIME_BROADCAST_INTERVAL:-0.25}
  OKX_TIMEOUT_SECONDS: ${OKX_TIMEOUT_SECONDS:-5}

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    environment: *sonic-environment
    volumes:
      - ./results:/app/results
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "8501:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  paper-monitor:
    build: .
    command: python paper_monitor.py
    environment: *sonic-environment
    volumes:
      - ./data/cache:/app/data/cache
      - ./results:/app/results
    restart: unless-stopped
