services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./results:/app/results
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "8501:80"
    depends_on:
      - backend
    restart: unless-stopped

  paper-monitor:
    build: .
    command: python paper_monitor.py
    volumes:
      - ./data/cache:/app/data/cache
      - ./results:/app/results
    restart: unless-stopped
